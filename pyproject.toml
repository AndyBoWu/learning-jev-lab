[project]
name = "typed-decision-lab"
version = "0.2.0"
description = "Hands-on labs for Jev, Laya, and typed AI decision systems."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typesafe-sdk>=0.6.0,<0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
